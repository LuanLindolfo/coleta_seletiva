<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><rect width="480" height="360" fill="#1f5c2e"></rect><text x="240" y="76" font-family="Sans Serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#ffe066">PARABÉNS!</text><text x="240" y="112" font-family="Sans Serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">Você é Mestre da Reciclagem</text><text x="240" y="158" font-family="Sans Serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffd166">Você sabia?</text><text x="240" y="190" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Separar o lixo reduz o que vai para aterros e lixões.</text><text x="240" y="216" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Cooperativas de catadores vivem do material reciclável.</text><text x="240" y="242" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Reduzir e reutilizar vêm antes de reciclar.</text><text x="240" y="330" font-family="Sans Serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#c8f0d0">Clique na bandeira verde para jogar de novo</text></svg>
