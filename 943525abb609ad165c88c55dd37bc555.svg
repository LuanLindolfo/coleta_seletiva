<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="440" height="60" viewBox="0 0 440 60"><rect x="2" y="2" width="436" height="56" rx="10" fill="#101820" fill-opacity="0.92" stroke="#1e6fd9" stroke-width="4"></rect><text x="220" y="25" font-family="Sans Serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">ERROU! Papel e papelão vão na lixeira AZUL.</text><text x="220" y="45" font-family="Sans Serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#d7e3ee">Papel engordurado ou molhado não pode ser reciclado.</text></svg>