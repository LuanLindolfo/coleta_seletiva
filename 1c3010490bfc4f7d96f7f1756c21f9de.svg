<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><rect width="480" height="360" fill="#3a1020"></rect><text x="240" y="80" font-family="Sans Serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#ff5a6e">FIM DE JOGO</text><text x="240" y="112" font-family="Sans Serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#ffffff">Suas vidas acabaram, mas dá para tentar de novo!</text><text x="240" y="160" font-family="Sans Serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffd166">Você sabia?</text><text x="240" y="192" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Papel engordurado ou molhado não pode ser reciclado.</text><text x="240" y="218" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Vidro e metal podem ser reciclados várias vezes.</text><text x="240" y="244" font-family="Sans Serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">Restos de comida viram adubo com a compostagem.</text><text x="240" y="330" font-family="Sans Serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#ffd1d6">Clique na bandeira verde para jogar de novo</text></svg>